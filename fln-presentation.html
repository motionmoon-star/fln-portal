<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FLN Portal — Présentation / تقديم</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --fln-bg: #0a1a0e;
  --fln-dark: #143718;
  --fln-mid: #1e5631;
  --fln-green: #006233;
  --fln-green-2: #005428;
  --fln-gold: #f59e0b;
  --fln-gold-dark: #d97706;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --white-30: rgba(255,255,255,.3);
}

body {
  background: var(--fln-bg);
  color: var(--text);
  min-height: 100vh;
  font-family: 'Cairo', system-ui, sans-serif;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(0,98,51,.25) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(20,55,24,.4) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(245,158,11,.04) 0%, transparent 40%),
    linear-gradient(160deg, #071208 0%, #0a1a0e 40%, #0d1117 100%);
}

.slide { display: none; }
.slide.active { display: flex; }

/* === CARDS === */
.card-dark {
  background: rgba(10,31,16,.5);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 20px;
  box-shadow: 0 8px 32px -8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);
  transition: box-shadow .3s, transform .3s;
}
.card-dark:hover {
  box-shadow: 0 16px 48px -8px rgba(0,0,0,.5);
  transform: translateY(-3px);
}
.card-dark-static { background: rgba(10,31,16,.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.06); border-radius: 20px; box-shadow: 0 8px 32px -8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04); pointer-events: none; }
.card-dark-static:hover { box-shadow: 0 8px 32px -8px rgba(0,0,0,.4); transform: none; }

/* === BUTTONS === */
.btn-pill {
  display: inline-block;
  border-radius: 999px;
  overflow: hidden;
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 900;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: all .4s cubic-bezier(.23,1,.32,1);
  position: relative;
}
.btn-pill:hover { transform: translateY(-3px) scale(1.02); }
.btn-pill:active { transform: scale(0.97); }
.btn-gold-pill {
  background: linear-gradient(135deg, var(--fln-gold), var(--fln-gold-dark));
  color: var(--fln-dark);
  box-shadow: 0 6px 24px -4px rgba(245,158,11,.4);
}
.btn-green-pill {
  background: linear-gradient(135deg, var(--fln-green), var(--fln-green-2));
  color: #fff;
  box-shadow: 0 6px 24px -4px rgba(0,98,51,.4);
}
.btn-glass-pill {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(8px);
  color: var(--text);
}
.btn-outline-pill {
  background: transparent;
  color: var(--fln-gold);
  border: 1.5px solid var(--fln-gold);
}
.btn-sm { padding: 8px 20px; font-size: 12px; }

/* === FORMS === */
.input-dark {
  width: 100%;
  background: rgba(255,255,255,.06);
  border: 1.5px solid rgba(255,255,255,.1);
  border-radius: 14px;
  padding: 14px 16px;
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  font-family: inherit;
  transition: border-color .2s, box-shadow .2s, background .2s;
  box-sizing: border-box;
}
.input-dark::placeholder { color: var(--white-30); }
.input-dark option { background: var(--fln-dark); color: var(--text); }
.input-dark:focus {
  outline: none;
  border-color: var(--fln-green);
  box-shadow: 0 0 0 3px rgba(0,98,51,.15), 0 0 16px rgba(0,98,51,.1);
  background: rgba(255,255,255,.08);
}
#slide3 .input-dark:focus {
  border-color: #60a5fa;
  box-shadow: 0 0 0 3px rgba(96,165,250,.15), 0 0 16px rgba(96,165,250,.1);
}

.float-label-group { position: relative; display: block; }
.float-label-group label {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  left: 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  pointer-events: none;
  transition: all .2s;
  background: transparent;
  padding: 0 4px;
}
.float-label-group .input-dark:focus + label,
.float-label-group .input-dark:not(:placeholder-shown) + label,
.float-label-group select:focus + label,
.float-label-group select + label {
  top: 0;
  font-size: 10px;
  color: var(--fln-gold);
  background: var(--fln-bg);
  padding: 0 6px;
}
#slide3 .float-label-group .input-dark:focus + label,
#slide3 .float-label-group .input-dark:not(:placeholder-shown) + label {
  color: #60a5fa;
}
select.input-dark { appearance: auto; }

/* === BADGES === */
.badge-active {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(34,197,94,.1);
  color: #4ade80;
  border: 1px solid rgba(34,197,94,.25);
}
.badge-active::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse 2s infinite;
}

/* === TABLES === */
table { width: 100%; border-collapse: collapse; }
th {
  padding: 10px 8px;
  font-size: 11px;
  font-weight: 700;
  text-align: right;
  text-transform: uppercase;
}
.table-militants th { background: var(--fln-gold); color: var(--fln-dark); }
.table-candidates th { background: rgba(255,255,255,.04); color: var(--muted); }
td {
  padding: 10px 8px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  font-size: 13px;
}
tbody tr:nth-child(even) td { background: rgba(255,255,255,.02); }
tbody tr:hover td { background: rgba(255,255,255,.05); }

/* === DOTS === */
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,.25);
  cursor: pointer;
  transition: all .3s;
  display: inline-block;
}
.dot.active {
  background: var(--fln-gold);
  box-shadow: 0 0 8px rgba(245,158,11,.5);
}
.db-tab-btn.active {
  background: rgba(129,140,248,.15) !important;
  color: #fff !important;
  border-color: #818cf8 !important;
  box-shadow: 0 0 20px rgba(129,140,248,.15);
}

/* === HEADER === */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  background: rgba(0,50,25,.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0,98,51,.3);
}
.header-logo {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--fln-dark);
  border: 2px solid var(--fln-green);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 12px;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 0 16px rgba(0,98,51,.3);
}
.header-title {
  font-family: 'Cairo', sans-serif;
  font-weight: 900;
  font-size: 14px;
  color: #fff;
}
.header-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse 2s infinite;
  display: inline-block;
  margin-left: 6px;
}
.header-dots { display: flex; align-items: center; gap: 10px; }
.header-flags { display: flex; gap: 6px; }

/* === PROGRESS BAR (bottom) === */
.progress-bar-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 40;
  height: 4px;
  background: var(--fln-dark);
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--fln-gold), var(--fln-gold-dark));
  transition: width .45s ease;
}

/* === ANIMATIONS === */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeSlideUp .6s ease both; }
@keyframes flashGreen {
  0% { background-color: rgba(34,197,94,.45); }
  100% { background-color: transparent; }
}
@keyframes flashIndigo {
  0% { background-color: rgba(129,140,248,.3); }
  100% { background-color: transparent; }
}
.row-new { animation: flashIndigo 2.2s ease 1; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.shimmer-text {
  background: linear-gradient(135deg, #f59e0b, #fff 40%, #f59e0b 60%, #d97706);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 4s linear infinite;
}

/* === MISC === */
.pseudo-qr {
  background-image: repeating-linear-gradient(0deg, #111 0 2px, transparent 2px 5px),
    repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 5px);
}
.slide-accent-or .slide-glow { background: radial-gradient(ellipse at top, rgba(245,158,11,.12), transparent 60%); }
.slide-accent-vert .slide-glow { background: radial-gradient(ellipse at top, rgba(0,98,51,.15), transparent 60%); }
.slide-accent-bleu .slide-glow { background: radial-gradient(ellipse at top, rgba(96,165,250,.12), transparent 60%); }
.slide-accent-indigo .slide-glow { background: radial-gradient(ellipse at top, rgba(129,140,248,.12), transparent 60%); }
.text-gold { color: var(--fln-gold); }
.text-green { color: var(--fln-green); }
.text-indigo { color: #818cf8; }
.font-amiri { font-family: 'Amiri', Georgia, serif; }
.font-mono { font-family: 'Courier New', monospace; }
</style>
</head>
<body>
<header class="app-header">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="header-logo">FLN</div>
    <div class="header-dots">
      <span class="dot active" onclick="goToSlide(0)"></span>
      <span class="dot" onclick="goToSlide(1)"></span>
      <span class="dot" onclick="goToSlide(2)"></span>
      <span class="dot" onclick="goToSlide(3)"></span>
      <span class="dot" onclick="goToSlide(4)"></span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="header-title" data-i18n="slide1.badge"></span>
    <span class="header-dot"></span>
  </div>
  <div class="header-flags" id="langToggle">
    <button onclick="switchLang('ar')" class="btn-pill btn-sm btn-glass-pill" style="font-size:18px;line-height:1;">🇩🇿</button>
    <button onclick="switchLang('fr')" class="btn-pill btn-sm btn-glass-pill" style="font-size:18px;line-height:1;">🇫🇷</button>
  </div>
</header>

<div class="progress-bar-wrap">
  <div id="progressBar" class="progress-fill" style="width:20%"></div>
</div>

<!-- 5 slides (langue = bouton fixe) -->
<main id="deck" class="min-h-screen">
  <section id="slide1" class="slide active min-h-screen flex-col items-center justify-center px-6 py-16 slide-accent-or" style="background:linear-gradient(135deg,#143718 0%,#1e5631 50%,#0a1a0e 100%);">
    <div class="slide-glow" style="position:absolute;inset:0;pointer-events:none;"></div>
    <div class="text-center max-w-4xl mx-auto" style="position:relative;">
      <span class="btn-pill btn-outline-pill btn-sm" data-i18n="slide1.badge" style="margin-bottom:24px;"></span>
      <h1 class="shimmer-text font-amiri" style="font-size:clamp(28px,5vw,64px);font-weight:700;margin-bottom:16px;line-height:1.2;" data-i18n="slide1.title"></h1>
      <p style="color:var(--muted);font-size:clamp(14px,2vw,18px);margin-bottom:40px;" data-i18n="slide1.subtitle"></p>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:48px;">
        <div class="card-dark" style="padding:20px;text-align:center;">
          <div id="statWilayas" class="text-gold" style="font-size:clamp(24px,4vw,48px);font-weight:900;">0</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;" data-i18n="stats.wilayas"></div>
        </div>
        <div class="card-dark" style="padding:20px;text-align:center;">
          <div id="statKesmas" class="text-gold" style="font-size:clamp(24px,4vw,48px);font-weight:900;">0</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;" data-i18n="stats.kesmas"></div>
        </div>
        <div class="card-dark" style="padding:20px;text-align:center;">
          <div id="statMilitants" style="font-size:clamp(24px,4vw,48px);font-weight:900;color:#4ade80;">0</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;" data-i18n="stats.militants"></div>
        </div>
        <div class="card-dark" style="padding:20px;text-align:center;">
          <div id="statSatisfaction" class="text-gold" style="font-size:clamp(24px,4vw,48px);font-weight:900;">0</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;" data-i18n="stats.satisfaction"></div>
        </div>
      </div>
      <button id="startBtn" onclick="goToSlide(1)" class="btn-pill btn-gold-pill" data-i18n="nav.start"></button>
    </div>
  </section>

  <section id="slide2" class="slide min-h-screen flex-col items-center justify-center px-4 md:px-6 py-16">
  <div style="width:100%;max-width:1024px;margin:0 auto;">
    <div style="text-align:center;margin-bottom:32px;">
      <h2 style="font-size:clamp(20px,3.5vw,40px);font-weight:900;color:#fff;margin-bottom:8px;" data-i18n="slide2.title"></h2>
      <span class="btn-pill btn-green-pill btn-sm" data-i18n="slide2.subtitle"></span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;">
      <form id="militantForm" class="card-dark" style="padding:28px;border-top:3px solid var(--fln-green);">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="float-label-group">
            <select id="m-wilaya" class="input-dark" placeholder=" " style="padding-top:18px;"></select>
            <label data-i18n="form.wilaya"></label>
          </div>
          <div class="float-label-group">
            <select id="m-mohafadha" class="input-dark" placeholder=" " style="padding-top:18px;"></select>
            <label data-i18n="form.mohafadha"></label>
          </div>
        </div>
        <div class="float-label-group" style="margin-top:12px;">
          <select id="m-kesma" class="input-dark" placeholder=" " style="padding-top:18px;"></select>
          <label data-i18n="form.kesma"></label>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
          <div class="float-label-group"><input id="m-lastname" class="input-dark" placeholder=" " /><label data-i18n="form.lastname"></label></div>
          <div class="float-label-group"><input id="m-firstname" class="input-dark" placeholder=" " /><label data-i18n="form.firstname"></label></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
          <div class="float-label-group"><input id="m-dob" type="date" class="input-dark" placeholder=" " style="padding-top:18px;" /><label data-i18n="form.dob"></label></div>
          <div class="float-label-group"><input id="m-pob" class="input-dark" placeholder=" " /><label data-i18n="form.pob"></label></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
          <div class="float-label-group"><input id="m-nin" class="input-dark font-mono" dir="ltr" placeholder=" " /><label data-i18n="form.nin"></label></div>
          <div class="float-label-group"><input id="m-voteCard" class="input-dark font-mono" dir="ltr" placeholder=" " /><label data-i18n="form.voteCard"></label></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
          <div class="float-label-group"><input id="m-tel" class="input-dark font-mono" dir="ltr" placeholder=" " /><label data-i18n="form.tel"></label></div>
          <div class="float-label-group"><input id="m-email" class="input-dark font-mono" dir="ltr" placeholder=" " /><label data-i18n="form.email"></label></div>
        </div>
      </form>

      <div style="text-align:center;">
        <div id="militantCard" class="hidden" style="max-width:400px;margin:0 auto;">
          <div class="card-dark" style="padding:24px;overflow:hidden;position:relative;">
            <div style="position:absolute;top:0;left:0;right:0;height:4px;background:var(--fln-gold);"></div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
              <span style="font-size:10px;font-weight:700;color:var(--fln-gold);text-transform:uppercase;letter-spacing:.1em;" data-i18n="card.membership"></span>
              <img id="m-card-photo" style="width:56px;height:64px;object-fit:cover;border-radius:8px;border:2px solid rgba(245,158,11,.6);background:#cbd5e1;" alt="" />
            </div>
            <div style="color:#fff;text-align:right;">
              <div id="m-card-name" class="font-amiri" style="font-size:18px;font-weight:900;">—</div>
              <div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:8px;"><span data-i18n="card.id"></span>: <span id="m-card-id" class="font-mono text-gold" dir="ltr">—</span></div>
              <div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;"><span data-i18n="card.dobpob"></span>: <span id="m-card-dobpob" style="color:rgba(245,158,11,.8);">—</span></div>
              <div style="margin-top:16px;display:flex;justify-content:center;"><div class="pseudo-qr" style="width:64px;height:64px;background:#fff;border-radius:8px;"></div></div>
            </div>
          </div>
        </div>
        <button id="replayMilitant" onclick="resetMilitantDemo()" class="btn-pill btn-glass-pill btn-sm hidden" style="margin-top:16px;" data-i18n="nav.restart"></button>
      </div>
    </div>
  </div>
  </section>

  <section id="slide3" class="slide min-h-screen flex-col items-center justify-center px-4 md:px-6 py-16">
    <div style="width:100%;max-width:1024px;margin:0 auto;">
      <div style="text-align:center;margin-bottom:32px;">
        <h2 style="font-size:clamp(20px,3.5vw,40px);font-weight:900;color:#fff;margin-bottom:8px;" data-i18n="slide3.title"></h2>
        <span class="btn-pill btn-sm" style="background:rgba(96,165,250,.15);color:#60a5fa;border:1.5px solid #60a5fa;" data-i18n="slide3.subtitle"></span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;">
        <form id="candidateForm" class="card-dark" style="padding:28px;border-top:3px solid #60a5fa;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="float-label-group"><input id="c-lastname" class="input-dark" placeholder=" " /><label data-i18n="form.lastname"></label></div>
            <div class="float-label-group"><input id="c-firstname" class="input-dark" placeholder=" " /><label data-i18n="form.firstname"></label></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
            <div class="float-label-group"><input id="c-dob" type="date" class="input-dark" placeholder=" " style="padding-top:18px;" /><label data-i18n="form.dob"></label></div>
            <div class="float-label-group"><input id="c-pob" class="input-dark" placeholder=" " /><label data-i18n="form.pob"></label></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
            <div class="float-label-group">
              <select id="c-marital" class="input-dark" placeholder=" " style="padding-top:18px;"></select>
              <label data-i18n="cand.marital"></label>
            </div>
            <div class="float-label-group">
              <select id="c-service" class="input-dark" placeholder=" " style="padding-top:18px;"></select>
              <label data-i18n="cand.service"></label>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
            <div class="float-label-group"><input id="c-profession" class="input-dark" placeholder=" " /><label data-i18n="cand.profession"></label></div>
            <div class="float-label-group"><input id="c-phone" class="input-dark font-mono" dir="ltr" placeholder=" " /><label data-i18n="cand.phone"></label></div>
          </div>
          <div class="float-label-group" style="margin-top:12px;">
            <input id="c-mandates" class="input-dark" placeholder=" " />
            <label data-i18n="cand.mandates"></label>
          </div>
        </form>

        <div style="text-align:center;">
          <div id="candidatePreview" class="hidden" style="max-width:400px;margin:0 auto;">
            <div style="background:#fff;color:#1e293b;border-radius:16px;padding:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);border:1px solid #cbd5e1;overflow:hidden;">

let currentLang = 'ar';
let currentSlide = 0;
const t = (k) => translations[currentLang][k] || k;

function switchLang(lang) {
  if (!translations[lang]) return;
  currentLang = lang;
  document.documentElement.lang = lang === 'ar' ? 'ar' : lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('lang-ar', lang === 'ar');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const txt = t(el.dataset.i18n);
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') { if (el.placeholder !== undefined) el.placeholder = txt; }
    else el.textContent = txt;
  });
  if (typeof refreshTranslatedContent === 'function') refreshTranslatedContent();
}

function goToNext() { if (currentSlide < 4) goToSlide(currentSlide + 1); }
function goToPrev() { if (currentSlide > 0) goToSlide(currentSlide - 1); }

function goToSlide(n) {
  if (n < 0 || n > 4) return;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('slide' + (n + 1));
  if (el) el.classList.add('active');
  currentSlide = n;
  document.getElementById('progressBar').style.width = Math.round(((n + 1) / 5) * 100) + '%';
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === n);
  });
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevBtn) prevBtn.disabled = n === 0;
  if (nextBtn) nextBtn.disabled = n === 4;
  window.scrollTo(0, 0);
  if (typeof onSlideEnter === 'function') onSlideEnter(n);
}

let _statsAnimated = false;
function animateCount(el, to, duration, suffix) {
  const start = performance.now();
  function frame(now) {
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * eased).toLocaleString('en-US') + (suffix || '');
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function typeIntoField(el, text, speed) {
  return new Promise((resolve) => {
    el.value = '';
    el.dispatchEvent(new Event('input'));
    const delay = speed || 40;
    let i = 0;
    const timer = setInterval(() => {
      el.value = text.slice(0, ++i);
      el.dispatchEvent(new Event('input'));
      if (i >= text.length) { clearInterval(timer); resolve(); }
    }, delay);
  });
}
function setSelect(el, text) {
  return new Promise((resolve) => {
    el.value = text;
    el.dispatchEvent(new Event('change'));
    setTimeout(resolve, 250);
  });
}

  { id: '31.02/08/25/0112', lastname: 'بوتفليقة', firstname: 'أحمد', wilaya: 'وهران', kesma: 'بئر الجير', status: 'نشط' },
  { id: '19.01/06/24/0045', lastname: 'عياشي', firstname: 'نورة', wilaya: 'سطيف', kesma: 'سطيف', status: 'نشط' }
];
const DEMO_CANDIDATES = [
  { lastname: 'حداد', firstname: 'نور الدين', profession: 'أستاذ تعليم', wilaya: 'عنابة' },
  { lastname: 'زروقي', firstname: 'فاطمة', profession: 'طبيبة', wilaya: 'الجزائر' },
  { lastname: 'مزياني', firstname: 'عبد القادر', profession: 'مهندس', wilaya: 'بجاية' },
  { lastname: 'بلحاج', firstname: 'سعيد', profession: 'فلاح', wilaya: 'سوق أهراس' }
];
let _dbPlayed = false;

function dbRowMilitant(m, isNew) {
  return `<tr class="${isNew ? 'row-new' : ''} border-b border-slate-800">
    <td class="p-3 font-mono text-xs text-amber-300" dir="ltr">${m.id}</td>
    <td class="p-3 font-bold"><img src="${svgAvatar('M')}" class="inline-block w-7 h-8 object-cover rounded mr-2 align-middle" alt="" />${m.lastname} ${m.firstname}</td>
    <td class="p-3 text-slate-300">${m.wilaya}</td>
    <td class="p-3 text-slate-300">${m.kesma}</td>
    <td style="padding:10px 8px;"><span class="badge-active" data-i18n="db.active">${m.status}</span></td>
  </tr>`;
}
function dbRowCandidate(c) {
  return `<tr style="border-bottom:1px solid rgba(255,255,255,.06);">
    <td style="padding:10px 8px;font-weight:700;">${c.lastname} ${c.firstname}</td>
    <td style="padding:10px 8px;color:var(--muted);">${c.profession}</td>
    <td style="padding:10px 8px;"><span class="badge-active">نشط</span></td>
  </tr>`;
}
function switchDbTab(tab) {
  const m = tab === 'militants';
  document.getElementById('dbPanelMilitants').classList.toggle('hidden', !m);
  document.getElementById('dbPanelCandidates').classList.toggle('hidden', m);
  document.getElementById('tabMilitants').classList.toggle('active', m);
  document.getElementById('tabCandidates').classList.toggle('active', !m);
}
function playDatabaseDemo() {
  const e = DEMO_MILITANT_ENTRY;
  const newMilitant = { id: '16.03/02/26/4821', lastname: e.lastname, firstname: e.firstname, wilaya: e.wilaya, kesma: e.kesma, status: 'نشط' };
  const rows = DEMO_MILITANTS.map(m => dbRowMilitant(m, false));
  document.getElementById('dbMilitantsBody').innerHTML = rows.join('');
  document.getElementById('dbCandidatesBody').innerHTML = DEMO_CANDIDATES.map(dbRowCandidate).join('');
  let counter = 24500;
  const counterEl = document.getElementById('dbCounter');
  setTimeout(() => {
    document.getElementById('dbMilitantsBody').insertAdjacentHTML('afterbegin', dbRowMilitant(newMilitant, true));
    counter += 1;
    counterEl.textContent = counter.toLocaleString('en-US');
    const c = DEMO_CANDIDATE_ENTRY;
    const newCandidate = { lastname: c.lastname, firstname: c.firstname, profession: c.profession.ar, wilaya: c.pob };
    document.getElementById('dbCandidatesBody').insertAdjacentHTML('afterbegin', `<tr style="border-bottom:1px solid rgba(255,255,255,.06);">
      <td style="padding:10px 8px;font-weight:700;">${newCandidate.lastname} ${newCandidate.firstname}</td>
      <td style="padding:10px 8px;color:var(--muted);">${newCandidate.profession}</td>
      <td style="padding:10px 8px;"><span class="badge-active">نشط</span></td>
    </tr>`);
    counter += 1;
    counterEl.textContent = counter.toLocaleString('en-US');
  }, 600);
}
function resetDatabaseDemo() {
  _dbPlayed = false;
  document.getElementById('dbMilitantsBody').innerHTML = '';
  document.getElementById('dbCandidatesBody').innerHTML = '';
  document.getElementById('dbCounter').textContent = '24,500';
  switchDbTab('militants');
}
function onSlideEnter(n) {
  if (n === 0 && !_statsAnimated) {
    _statsAnimated = true;
    animateCount(document.getElementById('statWilayas'), 69, 1800);
    animateCount(document.getElementById('statKesmas'), 1240, 1400);
    animateCount(document.getElementById('statMilitants'), 24500, 1400, '+');
    animateCount(document.getElementById('statSatisfaction'), 92, 1200, '%');
  }
  if (n === 1 && !_demoPlayed) {
    _demoPlayed = true;
    setTimeout(playMilitantDemo, 400);
  }
  if (n === 2 && !_candDemoPlayed) {
    _candDemoPlayed = true;
    setTimeout(playCandidateDemo, 400);
  }
  if (n === 3 && !_dbPlayed) {
    _dbPlayed = true;
    setTimeout(playDatabaseDemo, 400);
  }
}
function refreshTranslatedContent() {
  const w = document.getElementById('m-wilaya');
  if (w && w.options.length) {
    const prev = w.value;
    w.innerHTML = DEMO_WILAYAS.map(x => `<option value="${x.name}">${currentLang === 'ar' ? x.name : x.nameFr}</option>`).join('');
    if (prev) { w.value = prev; w.dispatchEvent(new Event('change')); }
  }
  const cf = document.getElementById('candidateForm');
  if (cf) cf.reset();
  fillCandidateSelects();
  document.querySelectorAll('#dbMilitantsBody tr').forEach(row => {
    const s = row.querySelector('span[data-i18n="db.active"]');
    if (s) s.textContent = currentLang === 'ar' ? 'نشط' : 'Actif';
  });
  document.querySelectorAll('#dbCandidatesBody tr').forEach(row => {
    const s = row.querySelector('span');
    if (s) s.textContent = currentLang === 'ar' ? 'نشط' : 'Actif';
  });
  _demoPlayed = false;
  _candDemoPlayed = false;
  _dbPlayed = false;
}
window.addEventListener('DOMContentLoaded', () => onSlideEnter(0));
window.addEventListener('DOMContentLoaded', () => {
  fillMilitantSelects();
  fillCandidateSelects();
  switchLang('ar');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { document.documentElement.dir === 'rtl' ? goToPrev() : goToNext(); }
  if (e.key === 'ArrowLeft') { document.documentElement.dir === 'rtl' ? goToNext() : goToPrev(); }
  if (e.key === ' ') { e.preventDefault(); goToNext(); }
});
</script>
</body>
</html>
